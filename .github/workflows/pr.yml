name: pr

on:
  pull_request:

# Newer pushes to the same PR cancel in-flight runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Cover the range declared in pyproject (requires-python >=3.10).
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      # ffmpeg/ffprobe so the audio tests gated on their presence actually run.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: astral-sh/setup-uv@v8.3.1
        with:
          enable-cache: true

      # --frozen also fails the PR if uv.lock is out of date with pyproject.
      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest

  docker-build:
    name: docker build (no push)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          # Read this PR's cache first, then fall back to the amd64 compile cache
          # build-image populates on main, so whisper.cpp isn't rebuilt each time.
          cache-from: |
            type=gha,scope=pr-linux-amd64
            type=gha,scope=linux-amd64
          # Write to a PR-scoped key so iterating on a PR is fast without
          # clobbering the cache the push workflow relies on.
          cache-to: type=gha,mode=max,scope=pr-linux-amd64
