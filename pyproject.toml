[project]
name = "whisper-batch"
version = "0.1.0"
description = "Parallel whisper.cpp transcription via silence-aware audio chunking."
readme = "README.md"
requires-python = ">=3.10"
# The CLI has no Python runtime dependencies — ffmpeg and whisper.cpp are
# external binaries. The optional HTTP server (`[server]` extra) adds FastAPI.
dependencies = []

[project.optional-dependencies]
# Long-running HTTP transcription service: `pip install whisper-batch[server]`.
server = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]

[project.scripts]
whisper-batch = "whisper_batch.cli:main"
whisper-batch-server = "whisper_batch.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whisper_batch"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    # Server extra + its test client, so `uv sync` covers the HTTP test suite.
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
