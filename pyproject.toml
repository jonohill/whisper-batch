[project]
name = "whisper-batch"
version = "0.1.0"
description = "Parallel whisper.cpp transcription via silence-aware audio chunking."
readme = "README.md"
requires-python = ">=3.10"
# No Python runtime dependencies — ffmpeg and whisper.cpp are external binaries.
dependencies = []

[project.scripts]
whisper-batch = "whisper_batch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whisper_batch"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=4.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
