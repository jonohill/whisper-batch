# Run the OpenAI-compatible transcription service:
#
#   docker compose up --build
#
# On first start the model named by WHISPER_MODEL_NAME (default base.en) is
# downloaded from Hugging Face into the `models` named volume and reused after.
#
# Then: curl -F file=@audio.mp3 -F response_format=srt \
#            http://localhost:8000/v1/audio/transcriptions
#
# Values like ${WHISPER_MODEL_NAME} below are read from your shell or a .env
# file next to this one, so you can re-point things without editing the file.

services:
  whisper-batch:
    build:
      context: .
      args:
        # Which whisper.cpp release to compile (see Dockerfile).
        WHISPER_CPP_REF: v1.8.4
        # OFF -> portable image (any arm64/x86-64 CPU). Set ON to optimise for
        # this host's exact microarch (a small speed-up, non-portable binary).
        GGML_NATIVE: "OFF"
    image: whisper-batch:latest # tag applied to the built image
    restart: unless-stopped

    ports:
      - "8000:8000" # host:container — change the left side to relocate

    volumes:
      # Persistent model cache.
      - models:/models

    environment:
      # Model to fetch on first start, by whisper.cpp name (base.en, small, ...).
      # Resolves to /models/ggml-<name>.bin and downloads it if absent.
      WHISPER_MODEL_NAME: ${WHISPER_MODEL_NAME:-base.en}
      # OPTIONAL — explicit path to a model file inside the container. When set
      # and present, this wins and no download happens (use with a bind mount).
      WHISPER_MODEL: ${WHISPER_MODEL:-}
      # OPTIONAL — when set, requests must send `Authorization: Bearer <key>`.
      # Leave unset/empty for an open endpoint (e.g. behind a private network).
      WHISPER_BATCH_API_KEY: ${WHISPER_BATCH_API_KEY:-}
      # OPTIONAL — reject uploads larger than this many MB with HTTP 413.
      # Defaults to 25 (matching OpenAI); set 0 to disable the cap.
      WHISPER_BATCH_MAX_UPLOAD_MB: ${WHISPER_BATCH_MAX_UPLOAD_MB:-25}

    # Args are appended to the image's entrypoint
    # (`whisper-batch-server --host 0.0.0.0 --port 8000`). Tune the warm pool here:
    #   -w  warm whisper-server instances (= max chunks in flight)
    #   -t  threads per instance
    #   -l  force a language code (omit to auto-detect per chunk)
    #   --no-gpu  required: the image is built CPU-only
    #   -v / -vv  INFO / DEBUG logging
    command: ["-w", "4", "-t", "2", "--no-gpu"]

    # Cap the cores/memory this container may use. NOTE: Python reads the *host*
    # CPU count, not this cgroup limit — so set -w/-t above to match `cpus` here
    # rather than relying on auto-detection. Rule of thumb: workers x threads ~= cpus.
    deploy:
      resources:
        limits:
          cpus: "8.0"
          memory: 8g

    # A HEALTHCHECK (polls /health) is baked into the image; uncomment to override.
    # healthcheck:
    #   test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)"]
    #   interval: 30s
    #   timeout: 5s
    #   start_period: 300s
    #   retries: 3

volumes:
  # Holds downloaded ggml models across container restarts and rebuilds.
  models:
